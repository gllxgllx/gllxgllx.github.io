<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eef2e9">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="description" content="风起小岛：把一片浅海放在掌心。旋转、轻摇，或点起一圈涟漪，来自格致博客的互动微缩海岛。">
  <link rel="canonical" href="https://gllxgllx.github.io/works/island-in-motion/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="风起小岛 · 格致">
  <meta property="og:description" content="转一个角度，轻轻摇晃，让海水慢慢回应。">
  <meta property="og:url" content="https://gllxgllx.github.io/works/island-in-motion/">
  <meta property="og:image" content="https://gllxgllx.github.io/works/island-in-motion/cover.webp">
  <meta property="og:locale" content="zh_CN">
  <title>风起小岛 · 格致</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #294b43; background: #eef2e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, input:focus-visible + span { outline: 3px solid #42796a; outline-offset: 5px; }
    [hidden] { display: none !important; }
    .landing { min-height: 100vh; min-height: 100svh; position: relative; display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }
    .poster { position: absolute; z-index: -3; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
    .wash { position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(238,242,233,.98) 0%, rgba(238,242,233,.9) 30%, rgba(238,242,233,.18) 68%, rgba(238,242,233,0) 100%), linear-gradient(0deg, rgba(238,242,233,.65), transparent 25%); }
    .topbar { padding: 2rem clamp(1.5rem, 5.6vw, 6rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .7rem; font-size: .86rem; letter-spacing: .2em; }
    .brand-mark { display: inline-block; width: 22px; height: 22px; border: 1px solid #4b7768; border-radius: 50%; position: relative; }
    .brand-mark::after { content: ""; position: absolute; left: 3px; right: 3px; top: 10px; border-top: 1px solid #4b7768; transform: rotate(-24deg); }
    .top-link { font-size: .78rem; border-bottom: 1px solid #a0b0a2; padding: .5rem 0; }
    .intro { margin: auto 0; padding: 3rem clamp(1.5rem, 5.6vw, 6rem) 4rem; max-width: 670px; }
    .eyebrow { display: flex; align-items: center; gap: .8rem; font-size: .69rem; letter-spacing: .25em; color: #638574; margin: 0 0 1.7rem; }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: #638574; }
    h1 { font-family: "STSong", "Songti SC", "SimSun", serif; font-size: clamp(3.5rem, 7vw, 6.3rem); font-weight: 400; line-height: 1.2; letter-spacing: .13em; margin: 0 0 1.1rem; }
    .subtitle { font-size: 1.1rem; letter-spacing: .18em; font-weight: 400; margin: 0 0 1.8rem; color: #52705d; }
    .description { font-size: .88rem; line-height: 2.1; color: #65766b; margin: 0; }
    .quality { border: 0; padding: 0; margin: 2.1rem 0 1.5rem; }
    .quality legend { font-size: .71rem; color: #718579; margin-bottom: .7rem; letter-spacing: .1em; }
    .quality-options { display: inline-flex; gap: 4px; background: rgba(248,250,244,.75); border: 1px solid #c7d3c8; border-radius: 8px; padding: 4px; }
    .quality label { position: relative; cursor: pointer; }
    .quality input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .quality label span { display: inline-flex; align-items: center; gap: .4rem; border-radius: 5px; padding: .65rem .95rem; font-size: .78rem; color: #6d7b71; }
    .quality label small { font-size: .61rem; opacity: .8; }
    .quality input:checked + span { color: #295b4a; background: #d9e7db; box-shadow: inset 0 0 0 1px #b3cbb8; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 1.5rem; }
    .enter { min-width: 210px; display: inline-flex; justify-content: space-between; align-items: center; gap: 2rem; padding: 1.05rem 1.4rem; border: 1px solid #335d4f; border-radius: 7px; color: #f2f5eb; background: #335d4f; font-size: .88rem; transition: background .2s, transform .2s; }
    .enter:hover { background: #244d40; transform: translateY(-2px); }
    .back { font-size: .79rem; padding: .65rem 0; color: #607567; }
    .back:hover, .top-link:hover { color: #1d4a39; }
    .hint { font-size: .68rem; color: #859285; line-height: 1.8; margin: 1rem 0 0; max-width: 26rem; }
    .footer { display: flex; justify-content: space-between; gap: 1rem; padding: 0 clamp(1.5rem, 5.6vw, 6rem) 1.8rem; font-size: .65rem; letter-spacing: .1em; color: #819281; }
    .scene { position: fixed; inset: 0; z-index: 10; background: #eef2e9; }
    .scene iframe { display: block; width: 100%; height: 100%; border: 0; }
    .exit { position: absolute; z-index: 3; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); padding: .65rem .9rem; border: 1px solid rgba(94,127,105,.24); border-radius: 30px; background: rgba(245,248,239,.91); color: #42624e; box-shadow: 0 3px 16px rgba(41,75,67,.05); font-size: .72rem; backdrop-filter: blur(10px); }
    .exit:hover { background: #fff; }
    .scene-status { position: absolute; z-index: 2; inset: 0; display: grid; place-content: center; text-align: center; gap: .7rem; pointer-events: none; color: #52705d; background: #eef2e9; font-size: .9rem; }
    .scene-status small { color: #859285; font-size: .73rem; }
    @media (max-width: 700px) { .topbar { padding-top: 1.4rem; } .poster { object-position: 64% 30%; height: 62%; } .wash { background: linear-gradient(0deg, #eef2e9 28%, rgba(238,242,233,.9) 47%, rgba(238,242,233,0) 80%); } .intro { margin: auto 0 0; padding-top: 39vh; padding-bottom: 2.4rem; max-width: none; } .eyebrow { margin-bottom: 1.1rem; font-size: .62rem; } h1 { font-size: clamp(3rem, 12vw, 4.6rem); } .subtitle { font-size: 1rem; margin-bottom: 1.2rem; } .description { font-size: .83rem; } .quality { margin-top: 1.6rem; } .quality label span { padding: .6rem .75rem; } .footer { flex-wrap: wrap; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .enter:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="landing" id="landing">
    <img class="poster" src="./cover.webp" alt="" fetchpriority="high">
    <div class="wash" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="格致博客首页"><span class="brand-mark" aria-hidden="true"></span>格 致</a>
      <a class="top-link" href="/works/">作品集 <span aria-hidden="true">↗</span></a>
    </header>
    <div class="intro">
      <p class="eyebrow">掌心里的风与潮 · 互动微缩世界</p>
      <h1>风起小岛</h1>
      <h2 class="subtitle">把片刻安静，留在这一方海。</h2>
      <p class="description">沙滩、椰影，还有一汪透亮的海水。<br>转一个角度，轻轻摇晃，<br>让涟漪替你慢下来。</p>
      <fieldset class="quality">
        <legend>选择海面的细腻程度</legend>
        <div class="quality-options">
          <label><input type="radio" name="quality" value="efficient"><span>轻盈 <small>128</small></span></label>
          <label><input type="radio" name="quality" value="balanced" checked><span>均衡 <small>128</small></span></label>
          <label><input type="radio" name="quality" value="high"><span>细腻 <small>256</small></span></label>
        </div>
      </fieldset>
      <div class="actions">
        <button class="enter" id="enter" type="button"><span>去岛上坐坐</span><span aria-hidden="true">→</span></button>
        <a class="back" href="/">返回博客</a>
      </div>
      <p class="hint">拖动环游 · 轻摇侧壁 · 点水起波<br>若设备运行较慢，可以选择轻盈画质。</p>
      <noscript><p class="hint">请启用 JavaScript 后进入互动场景。</p></noscript>
    </div>
    <footer class="footer"><span>风来时，海水会记得。</span><span>格致 · 一处安静的小世界</span></footer>
  </main>
  <section class="scene" id="scene" aria-label="风起小岛互动场景" hidden>
    <button class="exit" id="exit" type="button" aria-label="退出场景并返回作品入口">← 返回作品</button>
    <div class="scene-status" id="status" role="status" aria-live="polite">正在靠近这片浅海…<small>初次进入需要一点时间</small></div>
  </section>
  <script>
    (() => {
      const landing = document.getElementById('landing');
      const scene = document.getElementById('scene');
      const enter = document.getElementById('enter');
      const exit = document.getElementById('exit');
      const status = document.getElementById('status');
      let frame = null;
      let slowLoadTimer = null;
      let childKeyTarget = null;
      const leave = () => {
        clearTimeout(slowLoadTimer);
        if (childKeyTarget) childKeyTarget.removeEventListener('keydown', onEscape);
        childKeyTarget = null;
        if (frame) frame.remove();
        frame = null;
        scene.hidden = true;
        landing.hidden = false;
        document.body.style.overflow = '';
        enter.focus();
      };
      const onEscape = (event) => {
        if (event.key !== 'Escape' || !frame) return;
        event.preventDefault();
        leave();
      };
      enter.addEventListener('click', () => {
        if (frame) return;
        const selected = document.querySelector('input[name="quality"]:checked');
        const quality = ['efficient', 'balanced', 'high'].includes(selected?.value) ? selected.value : 'balanced';
        landing.hidden = true;
        scene.hidden = false;
        document.body.style.overflow = 'hidden';
        status.hidden = false;
        status.replaceChildren(document.createTextNode('正在靠近这片浅海…'));
        const note = document.createElement('small');
        note.textContent = '初次进入需要一点时间';
        status.append(note);
        frame = document.createElement('iframe');
        const activeFrame = frame;
        activeFrame.title = '风起小岛互动场景';
        activeFrame.allow = 'fullscreen';
        activeFrame.src = './scene/?quality=' + quality;
        activeFrame.addEventListener('load', () => {
          if (frame !== activeFrame) return;
          clearTimeout(slowLoadTimer);
          status.hidden = true;
          try {
            childKeyTarget = activeFrame.contentWindow.document;
            childKeyTarget.addEventListener('keydown', onEscape);
          } catch (_) { /* The visible return button remains available. */ }
        });
        scene.append(activeFrame);
        slowLoadTimer = setTimeout(() => {
          if (frame !== activeFrame || status.hidden) return;
          note.textContent = '加载较慢，可以返回后重试。';
        }, 20000);
        exit.focus();
      });
      exit.addEventListener('click', leave);
      document.addEventListener('keydown', onEscape);
    })();
  </script>
</body>
</html>
