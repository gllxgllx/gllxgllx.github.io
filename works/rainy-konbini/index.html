<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#071220">
  <meta name="description" content="雨夜便利店：一处可以走进去的日系雨夜街角，来自格致博客的互动作品。">
  <link rel="canonical" href="https://gllxgllx.github.io/works/rainy-konbini/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="雨夜便利店 · 格致">
  <meta property="og:description" content="夜深了，街角的灯还亮着。走进这间雨夜便利店，在暖光里停留一会儿。">
  <meta property="og:url" content="https://gllxgllx.github.io/works/rainy-konbini/">
  <meta property="og:image" content="https://gllxgllx.github.io/works/rainy-konbini/poster.png">
  <meta property="og:locale" content="zh_CN">
  <title>雨夜便利店 · 格致</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #f2f1ed; background: #071220; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible + span { outline: 3px solid #e3bc73; outline-offset: 5px; }
    [hidden] { display: none !important; }
    .landing { position: relative; isolation: isolate; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
    .poster { position: absolute; z-index: -3; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
    .shade { position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(4,14,26,.94) 0%, rgba(4,14,26,.78) 35%, rgba(4,14,26,.24) 75%), linear-gradient(0deg, rgba(4,14,26,.8), transparent 45%); }
    .grain { position: absolute; z-index: -1; inset: 0; pointer-events: none; background: repeating-linear-gradient(114deg, transparent 0 75px, rgba(166,198,220,.045) 76px 77px, transparent 78px 152px); }
    .topbar { padding: 2rem clamp(1.5rem, 6vw, 6rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: inline-flex; align-items: center; gap: .75rem; font-size: .85rem; letter-spacing: .2em; color: #dbe3eb; }
    .brand-mark { height: 23px; width: 23px; border: 1px solid #d6b67b; position: relative; }
    .brand-mark::after { content: ""; position: absolute; inset: 5px; border-left: 1px solid #d6b67b; border-top: 1px solid #d6b67b; }
    .top-link { color: #c1cbd5; font-size: .78rem; padding: .5rem 0; border-bottom: 1px solid rgba(193,203,213,.4); }
    .intro { width: min(100%, 790px); margin: auto 0; padding: 4rem clamp(1.5rem, 6vw, 6rem) 5rem; }
    .eyebrow { display: flex; align-items: center; gap: .8rem; color: #dac091; font-size: .67rem; font-weight: 500; letter-spacing: .2em; margin: 0 0 2rem; }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: #d5b278; }
    h1 { font-family: "Yu Mincho", "Hiragino Mincho ProN", "STSong", "SimSun", serif; font-weight: 400; font-size: clamp(3rem, 6.3vw, 6rem); letter-spacing: .1em; line-height: 1.25; margin: 0 0 1rem; }
    .subtitle { font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 400; color: #e6d9c2; letter-spacing: .25em; margin: 0 0 1.7rem; }
    .description { max-width: 26rem; margin: 0; font-size: .9rem; color: #b3c0ce; line-height: 2.1; }
    .quality { padding: 0; border: 0; margin: 2.2rem 0 1.4rem; }
    .quality legend { font-size: .71rem; color: #a8b7c8; margin-bottom: .75rem; letter-spacing: .1em; }
    .quality-options { display: inline-flex; border: 1px solid rgba(175,194,214,.25); border-radius: 8px; padding: 4px; background: rgba(6,17,29,.5); }
    .quality label { position: relative; cursor: pointer; }
    .quality input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .quality label span { display: inline-flex; align-items: center; gap: .5rem; padding: .65rem 1rem; border-radius: 5px; color: #aebdcc; font-size: .8rem; }
    .quality label small { font-size: .61rem; opacity: .75; }
    .quality input:checked + span { color: #f0dfc1; background: rgba(202,170,112,.16); box-shadow: inset 0 0 0 1px rgba(202,170,112,.33); }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 1.4rem; }
    .enter { display: inline-flex; align-items: center; justify-content: space-between; gap: 3rem; min-width: 215px; padding: 1.05rem 1.4rem; border: 1px solid #e1bf81; border-radius: 7px; background: #dfbd7e; color: #16202b; font-size: .88rem; font-weight: 600; box-shadow: 0 6px 28px rgba(220,176,104,.1); transition: background .2s, transform .2s; }
    .enter:hover { background: #efd099; transform: translateY(-2px); }
    .back { font-size: .78rem; color: #becbd7; padding: .6rem 0; }
    .back:hover, .top-link:hover { color: #fff; }
    .hint { font-size: .69rem; color: #8193a8; margin: 1rem 0 0; line-height: 1.8; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 1.2rem; padding: 0 clamp(1.5rem, 6vw, 6rem) 1.8rem; color: #7d8fa3; font-size: .65rem; letter-spacing: .08em; }
    .scene { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: calc(48px + env(safe-area-inset-top)) minmax(0, 1fr); background: #071220; }
    .scene iframe { grid-row: 2; width: 100%; height: 100%; min-width: 0; min-height: 0; border: 0; display: block; }
    .scene-tools { grid-row: 1; position: relative; z-index: 2; display: flex; align-items: center; gap: 6px; padding: calc(5px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 5px max(10px, env(safe-area-inset-left)); border-bottom: 1px solid rgba(201,214,226,.22); background: #0b1827; }
    .scene-tools button, .scene-tools a { border: 0; background: transparent; color: #e0e7ef; padding: .55rem .7rem; border-radius: 5px; font-size: .72rem; }
    .scene-tools button:hover, .scene-tools a:hover { background: rgba(225,237,247,.12); }
    .scene-status { position: absolute; z-index: 1; inset: calc(48px + env(safe-area-inset-top)) 0 0; display: grid; place-content: center; text-align: center; gap: .7rem; pointer-events: none; background: #071220; color: #d9c39b; font-size: .9rem; }
    .scene-status small { color: #8598ad; font-size: .73rem; }
    .scene-status a { pointer-events: auto; color: #e8c990; text-decoration: underline; text-underline-offset: .3em; }
    @media (max-width: 700px) { .topbar { padding-top: 1.4rem; } .poster { object-position: 62% center; } .shade { background: linear-gradient(0deg, rgba(4,14,26,.96) 0%, rgba(4,14,26,.76) 45%, rgba(4,14,26,.37) 100%); } .intro { margin: auto 0 0; padding-top: 5rem; padding-bottom: 3rem; } .eyebrow { margin-bottom: 1.3rem; font-size: .6rem; letter-spacing: .14em; } h1 { font-size: clamp(2.7rem, 10vw, 4.5rem); } .description { font-size: .85rem; } .quality { margin-top: 1.8rem; } .footer { flex-wrap: wrap; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } .enter:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="landing" id="landing">
    <img class="poster" src="./poster.png" alt="" fetchpriority="high">
    <div class="shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="格致博客首页"><span class="brand-mark" aria-hidden="true"></span>格 致</a>
      <a class="top-link" href="/works/">作品集 <span aria-hidden="true">↗</span></a>
    </header>
    <div class="intro">
      <p class="eyebrow">A LITTLE CORNER AFTER DARK</p>
      <h1 lang="ja">雨の帰り道</h1>
      <h2 class="subtitle">雨夜便利店</h2>
      <p class="description">夜深了，街角的灯还亮着。<br>沿着被雨打湿的路，走进这间便利店，<br>在暖光里停留一会儿。</p>
      <fieldset class="quality">
        <legend>选择画质</legend>
        <div class="quality-options">
          <label><input type="radio" name="quality" value="low" checked><span>流畅 <small>推荐</small></span></label>
          <label><input type="radio" name="quality" value="high"><span>精致</span></label>
        </div>
      </fieldset>
      <div class="actions">
        <button class="enter" id="enter" type="button"><span>进入雨夜</span><span aria-hidden="true">→</span></button>
        <a class="back" href="/">返回博客</a>
      </div>
      <p class="hint">电脑浏览体验更佳 · 进入后可查看场景中的操作提示</p>
      <noscript><p class="hint">请启用 JavaScript 后进入互动场景。</p></noscript>
    </div>
    <footer class="footer"><span>一处雨夜的街角，一段安静的停留。</span><span>GEZHI · PERSONAL WORK</span></footer>
  </main>
  <section class="scene" id="scene" aria-label="雨夜便利店互动场景" hidden>
    <div class="scene-tools" role="toolbar" aria-label="场景导航">
      <button id="exit" type="button" aria-label="退出场景并返回画质选择">← 退出场景</button>
      <a href="/" aria-label="返回格致博客首页">返回博客 ↗</a>
    </div>
    <div class="scene-status" id="status" role="status" aria-live="polite">正在走进雨夜…<small>初次进入需要一点时间</small></div>
  </section>
  <script>
    (() => {
      const landing = document.getElementById('landing');
      const scene = document.getElementById('scene');
      const enter = document.getElementById('enter');
      const exit = document.getElementById('exit');
      const status = document.getElementById('status');
      let frame = null;
      let slowLoadTimer = null;
      let childKeyTarget = null;
      const leave = () => {
        clearTimeout(slowLoadTimer);
        if (childKeyTarget) childKeyTarget.removeEventListener('keydown', onEscape);
        childKeyTarget = null;
        if (frame) frame.remove();
        frame = null;
        scene.hidden = true;
        landing.hidden = false;
        document.body.style.overflow = '';
        enter.focus();
      };
      const onEscape = (event) => {
        if (event.key !== 'Escape' || !frame) return;
        // Leave pointer-lock handling to the scene while the pointer is captured.
        if (childKeyTarget && childKeyTarget.pointerLockElement) return;
        event.preventDefault();
        leave();
      };
      enter.addEventListener('click', () => {
        if (frame) return;
        const quality = document.querySelector('input[name="quality"]:checked').value === 'high' ? 'high' : 'low';
        landing.hidden = true;
        scene.hidden = false;
        document.body.style.overflow = 'hidden';
        status.hidden = false;
        status.replaceChildren(document.createTextNode('正在走进雨夜…'));
        const note = document.createElement('small');
        note.textContent = '初次进入需要一点时间';
        status.append(note);
        frame = document.createElement('iframe');
        const activeFrame = frame;
        activeFrame.title = '雨夜便利店互动场景';
        activeFrame.allow = 'fullscreen';
        activeFrame.allowFullscreen = true;
        activeFrame.src = './scene/?quality=' + quality;
        activeFrame.addEventListener('load', () => {
          if (frame !== activeFrame) return;
          clearTimeout(slowLoadTimer);
          status.hidden = true;
          try {
            childKeyTarget = activeFrame.contentWindow.document;
            childKeyTarget.addEventListener('keydown', onEscape);
          } catch (_) { /* The visible exit button remains available. */ }
        });
        scene.append(activeFrame);
        slowLoadTimer = setTimeout(() => {
          if (frame !== activeFrame || status.hidden) return;
          note.textContent = '加载较慢，可以退出后重试。';
        }, 20000);
        exit.focus();
      });
      exit.addEventListener('click', leave);
      document.addEventListener('keydown', onEscape);
    })();
  </script>
</body>
</html>
